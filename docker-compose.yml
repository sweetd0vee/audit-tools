# Audit Tools — локальный стек.
# Ollama на хосте (не в Compose): http://localhost:11434
# На Windows в настройках Ollama включите «Expose Ollama to the network»
# или задайте OLLAMA_HOST=0.0.0.0:11434, иначе контейнеры не достучатся.
#
# Запуск: docker compose up -d --build
# UI:     http://localhost:5174
# Чат:    http://localhost:3000
# Поиск:  http://localhost:8080
# API:    http://localhost:8100/docs

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_LIMITER=false
    networks:
      - ai-auditor

  open-webui:
    image: open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_NAME=Audit Tools
      # Веб-поиск в чате выключен: SearXNG только для библиотеки НПА (allowlist в backend).
    networks:
      - ai-auditor

  backend:
    build:
      context: ./backend
    container_name: audit-tool-server
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.6:35b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:latest}
      - SEARXNG_URL=http://searxng:8080/search
      - OPENWEBUI_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
    depends_on:
      - searxng
      - open-webui
    networks:
      - ai-auditor

  frontend:
    build:
      context: ./frontend
    container_name: audit-tools-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - ai-auditor

networks:
  ai-auditor:
    name: ai-auditor
    driver: bridge

volumes:
  open-webui-data:
