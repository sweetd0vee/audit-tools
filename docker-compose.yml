name: ai-auditor

# Audit Tools — локальный стек.
# Ollama на хосте (не в Compose): http://localhost:11434
# На Windows в настройках Ollama включите «Expose Ollama to the network»
# или задайте OLLAMA_HOST=0.0.0.0:11434, иначе контейнеры не достучатся.
#
# Продукт:  docker compose up -d --build
#           http://localhost:3000  (Open WebUI)
# API:      http://localhost:8100/docs
# Поиск:    http://localhost:8080  (внутренний, не для аудитора)
#
# Засев чата: seed/openwebui/README.md
# Админский гайд (числа RAG, модели, Pipe): docs/OPENWEBUI.md
# Если volume open-webui-data уже жил — env RAG ниже мог не примениться,
# правьте Admin → Documents вручную.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_LIMITER=false
    networks:
      - ai-auditor

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_NAME: Аудитор
      ENABLE_WEB_SEARCH: "false"
      RAG_EMBEDDING_ENGINE: ollama
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:latest}
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_TEXT_SPLITTER: token
      CHUNK_SIZE: "1600"
      CHUNK_OVERLAP: "180"
      RAG_TOP_K: "16"
      RAG_FULL_CONTEXT: "false"
      RAG_SYSTEM_CONTEXT: "true"
      # PersistentConfig: на уже существующем volume откройте Admin и вставьте
      # seed/openwebui/RAG_TEMPLATE.txt, если шаблон не подхватился.
      RAG_TEMPLATE: |
        Используй ТОЛЬКО фрагменты ниже.
        Если ответа нет во фрагментах — скажи об этом прямо. Не выдумывай статьи, пункты, даты и номера актов.
        Цитируй: полное название документа, статья/пункт, дословная формулировка.
        Не применяй нормы РФ, ЕС, МСФО/IFRS, если их нет во фрагментах.
        Клиентские факты (суммы, договоры, выгрузки) из этих фрагментов не выводи, если их там нет.

        {{CONTEXT}}
    networks:
      - ai-auditor

  backend:
    build:
      context: ./backend
    container_name: audit-tools
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./backend/data:/app/data
      - ./docs/prompts:/app/prompts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.8:27b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:latest}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - SEARXNG_URL=http://searxng:8080/search
      - OPENWEBUI_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      - PROMPTS_DIR=/app/prompts
    depends_on:
      - searxng
      - open-webui
    networks:
      - ai-auditor

  frontend:
    profiles: ["lab"]
    build:
      context: ./frontend
    container_name: audit-tools-ui
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - ai-auditor

networks:
  ai-auditor:
    name: ai-auditor
    driver: bridge

volumes:
  open-webui-data:
    name: audit-tools_open-webui-data
