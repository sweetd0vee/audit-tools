name: ai-auditor

# Audit Tools — локальный стек.
# Ollama на хосте (не в Compose): http://localhost:11434
# На Windows в настройках Ollama включите «Expose Ollama to the network»
# или задайте OLLAMA_HOST=0.0.0.0:11434, иначе контейнеры не достучатся.
#
# Продукт:  docker compose up -d --build
#           http://localhost:3000  (Open WebUI, только loopback)
# API:      http://localhost:8100/docs  (только loopback)
# SearXNG не публикуется — backend ходит по сети compose.
#
# Полнота библиотеки vs контур: NPA_WEB_FALLBACK=true в .env
# отправит названия актов в DuckDuckGo и Bing. По умолчанию выкл.
#
# Засев чата: seed/openwebui/seed_pipe.py (сервис pipe-seed при up)
# Админский гайд (числа RAG, модели, Pipe): docs/OPENWEBUI.md
# Если volume open-webui-data уже жил — RAG-env всё равно применяется:
# ENABLE_PERSISTENT_CONFIG=false, иначе остаются MiniLM / hybrid off / top-k=3.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_LIMITER=false
    networks:
      - ai-auditor

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_NAME: Аудитор
      ENABLE_WEB_SEARCH: "false"
      # Иначе старый volume держит MiniLM / hybrid off / top-k=3 / «не ту статью».
      ENABLE_PERSISTENT_CONFIG: "false"
      RAG_EMBEDDING_ENGINE: ollama
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:latest}
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_HYBRID_BM25_WEIGHT: "0.65"
      ENABLE_RAG_HYBRID_SEARCH_ENRICHED_TEXTS: "true"
      RAG_TEXT_SPLITTER: token
      ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER: "true"
      CHUNK_SIZE: "1600"
      CHUNK_OVERLAP: "180"
      CHUNK_MIN_SIZE_TARGET: "1000"
      RAG_TOP_K: "16"
      RAG_TOP_K_RERANKER: "10"
      RAG_FULL_CONTEXT: "false"
      RAG_SYSTEM_CONTEXT: "true"
      # Шаблон тоже из compose (PersistentConfig выключен — Admin его не перебьёт).
      RAG_TEMPLATE: |
        Используй ТОЛЬКО фрагменты ниже.
        Если ответа нет во фрагментах — скажи об этом прямо. Не выдумывай статьи, пункты, даты и номера актов.
        Цитируй: полное название документа, статья/пункт, дословная формулировка.
        Не применяй нормы РФ, ЕС, МСФО/IFRS, если их нет во фрагментах.
        Клиентские факты (суммы, договоры, выгрузки) из этих фрагментов не выводи, если их там нет.

        {{CONTEXT}}
    networks:
      - ai-auditor

  pipe-seed:
    build:
      context: ./backend
    container_name: audit-tools-pipe-seed
    restart: on-failure
    depends_on:
      - open-webui
    volumes:
      - ./seed/openwebui:/seed:ro
    environment:
      OPENWEBUI_URL: http://open-webui:8080
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      PIPE_AUDIT_API: http://backend:8100
      PIPE_PUBLIC_API: http://localhost:8100
    command: ["python", "/seed/seed_pipe.py"]
    networks:
      - ai-auditor

  backend:
    build:
      context: ./backend
    container_name: audit-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
      - ./docs/prompts:/app/prompts:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.8:27b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:latest}
      - OLLAMA_RERANK_MODEL=${OLLAMA_RERANK_MODEL:-dengcao/Qwen3-Reranker-4B:Q8_0}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - SEARXNG_URL=http://searxng:8080/search
      - OPENWEBUI_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      - PROMPTS_DIR=/app/prompts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NPA_WEB_FALLBACK=${NPA_WEB_FALLBACK:-false}
    depends_on:
      - searxng
      - open-webui
    networks:
      - ai-auditor

  frontend:
    profiles: ["lab"]
    build:
      context: ./frontend
    container_name: audit-tools-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - backend
    networks:
      - ai-auditor

networks:
  ai-auditor:
    name: ai-auditor
    driver: bridge

volumes:
  open-webui-data:
    name: audit-tools_open-webui-data
