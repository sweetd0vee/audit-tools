[project]
name = "audit-tools"
version = "0.0.1"
description = "Audit Tool Server — кейс проверки, библиотека НПА, RAG, черновики документов"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = [
    "backend/data",
    "docs",
    "seed",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["backend/data/", "docs/", "seed/"]

[[tool.mypy.overrides]]
module = [
    "app.services.brief_docx",
    "app.services.conclusion_docx",
]
ignore_errors = true
