[project]
name = "audit-tools"
version = "0.0.1"
description = "Audit Tool Server — кейс проверки, библиотека НПА, RAG, черновики документов"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = [
    "backend/data",
    "docs",
    "seed",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "ASYNC"]
ignore = [
    "E501",   # formatter owns wrapping
    "B008",   # FastAPI Depends() in defaults
    "UP017",  # datetime.utcnow — отдельный проход, не этот
    "UP045",  # Optional[X] → X | None — шумный дифф
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["backend/data/", "docs/", "seed/"]
