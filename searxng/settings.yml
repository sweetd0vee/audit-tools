use_default_settings: true

general:
  instance_name: "Audit Tools Search"
  enable_metrics: false

server:
  secret_key: "audit-tools-local-change-me-32chars"
  limiter: false
  image_proxy: false
  public_instance: false
  bind_address: "0.0.0.0"
  port: 8080
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru"
  formats:
    - html
    - json
